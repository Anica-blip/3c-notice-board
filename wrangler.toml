# wrangler.toml — 3C Notice Board Worker
# 3C Thread To Success™
#
# Deployed with Wrangler only (never paste the code into the Cloudflare
# dashboard — a Wrangler deploy would overwrite it):
#   cd ~/3c-deploy/3c-notice-board
#   npx wrangler deploy

name = "3c-notice-board"
main = "worker/index.js"
compatibility_date = "2024-09-23"
account_id = "5c482ede9d3c6e016b77a9cb86ed3a29"

# The free Cloudflare address is how the admin pages and the public viewer
# reach this Worker (WORKER_BASE in js/auth.js), so it stays on. The preview
# address is not used by anything and is switched off.
workers_dev = true
preview_urls = false

# R2 binding — the Worker's code refers to the bucket as env.NOTICE_BUCKET
[[r2_buckets]]
binding = "NOTICE_BUCKET"
bucket_name = "3c-library-files"

# No [vars] and no secrets: the owner check uses Supabase's public address and
# public anon key, which live in worker/index.js. Sign-in itself happens in
# the admin pages (GitHub through Supabase), not in this Worker.
